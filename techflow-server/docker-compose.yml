version: '3.8'

services:
  techflow-server:
    build: .
    container_name: techflow-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 持久化数据
      - ./data:/app/data
      # 缓存目录
      - ./public/cache:/app/public/cache
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_PASSWORD=admin # 请在部署时修改此默认密码
