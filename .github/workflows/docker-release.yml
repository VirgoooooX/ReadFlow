name: Docker Release (readflow-server)

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get changelog
        id: get_changelog
        run: |
          # 提取 package.json 中的 changelog 数组
          CHANGELOG=$(jq -c '.changelog' readflow-server/package.json)
          echo "CHANGELOG=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./readflow-server
          push: true
          tags: |
            virgoooox/readflowserver:latest
            virgoooox/readflowserver:${{ steps.get_version.outputs.VERSION }}
          build-args: |
            SERVER_VERSION=${{ steps.get_version.outputs.VERSION }}
            SERVER_BUILD=${{ github.run_id }}
            SERVER_BUILD_TIME=${{ github.event.repository.updated_at }}
            SERVER_CHANGELOG=${{ steps.get_changelog.outputs.CHANGELOG }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
