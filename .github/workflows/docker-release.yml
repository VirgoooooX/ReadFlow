name: Docker Release (readflow-server)

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    if: ${{ !startsWith(github.ref_name, 'app-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag version and detect combined release
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          SERVER_VERSION=${TAG#v}
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT
          
          # 检测当前 commit 上的所有 tags，寻找符合 App 格式的 tag
          APP_TAG=$(git tag --points-at HEAD | grep -E '^app-' | head -n 1)
          if [ -n "$APP_TAG" ]; then
            APP_VERSION=${APP_TAG#app-}
            APP_VERSION=${APP_VERSION#v}
            echo "RELEASE_NAME=ReadFlow App v$APP_VERSION & Server v$SERVER_VERSION" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_NAME=ReadFlow Server v$SERVER_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Get changelog
        id: get_changelog
        run: |
          # 提取 package.json 中的 changelog 数组
          CHANGELOG=$(jq -c '.changelog' readflow-server/package.json)
          echo "CHANGELOG=$CHANGELOG" >> $GITHUB_OUTPUT
          
          # 提取并格式化为 markdown 格式用于 GitHub Release
          echo "CHANGELOG_MD<<EOF" >> $GITHUB_OUTPUT
          if jq -e '.changelog | type == "array"' readflow-server/package.json >/dev/null; then
            jq -r '.changelog | map("- " + .) | join("\n")' readflow-server/package.json >> $GITHUB_OUTPUT
          else
            echo "No changelog provided." >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set image metadata
        id: image
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./readflow-server
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.OWNER_LC }}/readflowserver:latest
            ghcr.io/${{ steps.image.outputs.OWNER_LC }}/readflowserver:${{ steps.get_version.outputs.VERSION }}
          build-args: |
            SERVER_VERSION=${{ steps.get_version.outputs.VERSION }}
            SERVER_BUILD=${{ github.run_id }}
            SERVER_BUILD_TIME=${{ github.event.repository.updated_at }}
            SERVER_CHANGELOG=${{ steps.get_changelog.outputs.CHANGELOG }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ steps.get_version.outputs.RELEASE_NAME }}
          body: |
            ## Release ${{ steps.get_version.outputs.RELEASE_NAME }}
            
            ### Changelog (Server)
            ${{ steps.get_changelog.outputs.CHANGELOG_MD }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
