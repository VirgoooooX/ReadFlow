services:
  readflow-server:
    image: virgoooox/readflowserver:latest
    build:
      context: .
      args:
        SERVER_VERSION: ${SERVER_VERSION:-}
        SERVER_BUILD: ${SERVER_BUILD:-}
        SERVER_BUILD_TIME: ${SERVER_BUILD_TIME:-}
        SERVER_CHANGELOG: ${SERVER_CHANGELOG:-}
    container_name: readflow-server
    restart: unless-stopped
    ports:
      - "30000:3000"
    volumes:
      # 持久化数据
      - ./data:/app/data
      # 缓存目录
      - ./public/cache:/app/public/cache
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:?ENCRYPTION_SECRET is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - SERVER_TOKEN=${SERVER_TOKEN:-} # (可选) 设置此Token后，客户端连接和注册时必须提供匹配的Token
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required} # 请在部署时修改此默认密码
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/readflow?schema=public
      - IMAGE_WARMUP_ENABLED=${IMAGE_WARMUP_ENABLED:-0}
      - SHARP_CACHE_MEMORY_MB=${SHARP_CACHE_MEMORY_MB:-64}
      - SHARP_CONCURRENCY=${SHARP_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: readflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: readflow
    ports:
      - "5656:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d readflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./pgdata:/var/lib/postgresql/data
