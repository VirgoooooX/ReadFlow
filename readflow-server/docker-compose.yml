services:
  readflow-server:
    image: virgoooox/readflowserver:latest
    build:
      context: .
      args:
        SERVER_VERSION: ${SERVER_VERSION:-}
        SERVER_BUILD: ${SERVER_BUILD:-}
        SERVER_BUILD_TIME: ${SERVER_BUILD_TIME:-}
        SERVER_CHANGELOG: ${SERVER_CHANGELOG:-}
    container_name: readflow-server
    restart: unless-stopped
    ports:
      - "30000:3000"
    # 限制 Docker 容器日志大小，防止磁盘被日志撑满
    logging:
      driver: json-file
      options:
        max-size: "10m"   # 云端 Docker 日志硬上限 10MB
        max-file: "1"
    volumes:
      # 持久化数据
      - ./data:/app/data
      # 缓存目录
      - ./public/cache:/app/public/cache
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:?ENCRYPTION_SECRET is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - SERVER_TOKEN=${SERVER_TOKEN:-} # (可选) 设置此Token后，客户端连接和注册时必须提供匹配的Token
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required} # 请在部署时修改此默认密码
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/readflow?schema=public
      - IMAGE_WARMUP_ENABLED=${IMAGE_WARMUP_ENABLED:-0}
      - SHARP_CACHE_MEMORY_MB=${SHARP_CACHE_MEMORY_MB:-64}
      - SHARP_CONCURRENCY=${SHARP_CONCURRENCY:-2}
      - LOG_LEVEL=${LOG_LEVEL:-WARN}           # 日志级别: DEBUG / INFO / WARN / ERROR
      - LOG_FILE_ENABLED=${LOG_FILE_ENABLED:-0} # 云端默认不写重复文件日志，避免和 Docker 日志双份占用
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7} # 应用日志文件保留天数
      - LOG_REQUESTS_ENABLED=${LOG_REQUESTS_ENABLED:-0} # 默认关闭高频请求明细，排查问题时再开启
      - LOG_DAILY_MAX_BYTES=${LOG_DAILY_MAX_BYTES:-} # 可选兜底：设置后限制应用文件日志每天最大字节数
      - LOG_LINE_MAX_CHARS=${LOG_LINE_MAX_CHARS:-4000} # 单条日志最大长度
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: readflow-postgres
    restart: always
    # 限制 PostgreSQL 容器日志大小
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: readflow
    ports:
      - "5656:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d readflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./pgdata:/var/lib/postgresql/data
